[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aposteriori-cd"
version = "0.1.0"
description = "Paper reproduction code for a posteriori convection-diffusion experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Kiwoong Kwon"},
]
dependencies = [
    "numba>=0.64",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
